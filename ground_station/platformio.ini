; =========================================================
;  Micromouse Ground Station — ESP32-C3
;  Board  : ESP32-C3 (Super Mini / DevKit)
;  Upload : pio run --target upload
;  Monitor: pio device monitor
; =========================================================

[env:esp32-c3]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

; IMPORTANT: ESP-C3 uses USB-Serial-JTAG at boot.
; If upload fails, hold BOOT button while pressing RST, then release BOOT.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ESP Async WebServer
    AsyncTCP
    ArduinoJson @ ^6
