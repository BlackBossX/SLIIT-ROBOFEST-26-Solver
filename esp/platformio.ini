; =========================================================
;  Micromouse — Main Robot Controller (ESP32)
;  Board  : ESP32 DevKit V1
;  Upload : pio run --target upload
;  Monitor: pio device monitor
; =========================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

; Libraries
lib_deps =
    pololu/VL53L0X @ ^1.3.1
